<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>All In1 Shop - Main Admin Panel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .unique-nav-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .unique-nav-card:active {
      transform: scale(0.95);
    }
    .unique-nav-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="bg-slate-950 min-h-screen flex justify-center items-center p-0 md:p-4 text-slate-100">

  <!-- Admin Mobile Frame -->
  <div class="w-full max-w-md bg-slate-900 min-h-screen md:min-h-[840px] md:rounded-3xl shadow-2xl flex flex-col relative overflow-hidden pb-16 border border-slate-800">
    
    <!-- Header Bar -->
    <header id="adminHeader" class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/80 p-4 sticky top-0 z-30 flex justify-between items-center hidden">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-user-shield text-sm"></i>
        </div>
        <div>

          <p class="text-[10px] text-emerald-400 font-medium" data-i18n="liveSync">● Live Sync Active</p>
        </div>
      </div>
      <button onclick="openAddProductModal()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 shadow-md shadow-indigo-600/20 active:scale-95 transition">

    </header>

    <main id="adminMain" class="flex-1 overflow-y-auto no-scrollbar p-3.5 space-y-4">
    </main>

    <!-- Bottom Nav Bar -->

        </button>

      </div>
    </div>

    <!-- Confirm Action Modal -->
    <div id="confirmActionModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-slate-900 border border-slate-700 w-full max-w-xs rounded-2xl p-4 text-center space-y-3 shadow-2xl">
        <div id="confirmModalIcon" class="w-12 h-12 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto text-xl">

        <h3 id="confirmActionTitle" class="text-sm font-bold text-slate-100">নিশ্চয়তা প্রদান করুন</h3>

          <button id="confirmActionBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs transition shadow">
            Confirm
          </button>
          <button onclick="closeConfirmActionModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition">
            Cancel

        </div>
      </div>
    </div>

    <!-- Exit App Modal -->
    <div id="exitAppModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-slate-900 border border-slate-700/80 w-full max-w-xs rounded-2xl p-5 text-center space-y-3 shadow-2xl">
        <div class="w-12 h-12 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto text-xl">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </div>
        <h3 class="text-sm font-bold text-slate-100">Exit App?</h3>
        <p class="text-xs text-slate-400">আপনি কি এডমিন প্যানেল থেকে বের হতে চান?</p>
        <div class="flex gap-2 pt-2">

            <i class="fa-solid fa-check text-[10px]"></i> Confirm

          <button onclick="closeExitAppModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2 rounded-xl text-xs transition flex items-center justify-center gap-1">
            <i class="fa-solid fa-xmark text-[10px]"></i> Cancel
          </button>
        </div>
      </div>
    </div>

      return (translations[window.currentLang] && translations[window.currentLang][key]) || translations['bn'][key] || key;
    }

    function setAdminLanguage(lang) {
      window.currentLang = lang;
      localStorage.setItem('app_lang', lang);
      document.documentElement.lang = lang;
      if (window.renderAdminDashboard && window.storedAdmin) {
        window.renderAdminDashboard();
      } else if(window.renderAdminLoginScreen && !window.storedAdmin) {
        window.renderAdminLoginScreen();
      }
    }

    window.escapeHTML = function(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    };

  <!-- Firebase Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyTaNvT8S6Xg304_9ntWozi1k3N4DmNxM",
      authDomain: "all-in1-shop.firebaseapp.com",
      databaseURL: "https://all-in1-shop-default-rtdb.firebaseio.com",
      projectId: "all-in1-shop",
      storageBucket: "all-in1-shop.firebasestorage.app",
      messagingSenderId: "120883945223",
      appId: "1:120883945223:web:9f74f7ff3aa78f637fafa2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.db = db;
    window.auth = auth;

    window.storedAdmin = JSON.parse(localStorage.getItem('app_admin_session')) || null;
    window.products = [];
    window.categories = [];
    window.orders = [];
    window.customers = [];
    window.coupons = [];
    window.dues = [];
    window.expenses = [];
    window.paymentMethods = [];
    window.notifications = [];
    window.appUpdateInfo = null;
    window.activeView = 'menu';
    window.selectedProductCat = ' সকল ';
    window.selectedOrderStatusFilter = 'All';
    window.stockSearchQuery = '';
    window.orderSearchQuery = '';

    window.ADMIN_BUILD_VERSION = 'v1.8.0';
    window.currentAppVersion = localStorage.getItem('app_admin_installed_version') || window.ADMIN_BUILD_VERSION;

    history.replaceState({ view: 'menu' }, '');

    window.addEventListener('popstate', (event) => {
      const modal = document.getElementById('adminModal');
      const confirmModal = document.getElementById('confirmActionModal');
      const exitModal = document.getElementById('exitAppModal');

      if (exitModal && !exitModal.classList.contains('hidden')) {
        closeExitAppModal();
        return;
      }
      if (modal && !modal.classList.contains('hidden')) {
        closeAdminModal();
        return;
      }
      if (confirmModal && !confirmModal.classList.contains('hidden')) {
        closeConfirmActionModal();
        return;
      }

      if (window.activeView !== 'menu') {
        window.activeView = 'menu';
        renderAdminDashboard();
        return;
      }

      if (window.activeView === 'menu') {
        openExitAppModal();
      }
    });

    window.openExitAppModal = function() {
      const exitModal = document.getElementById('exitAppModal');
      if (exitModal) exitModal.classList.remove('hidden');
      history.pushState({ view: 'menu' }, '');
    };

    window.closeExitAppModal = function() {
      const exitModal = document.getElementById('exitAppModal');
      if (exitModal) exitModal.classList.add('hidden');
    };

    window.confirmExitApp = function() {
      closeExitAppModal();
      history.back();
    };

    window.showAdminToast = function(msg) {
      const toast = document.getElementById('adminToast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    };

    function isToday(timestamp) {
      if(!timestamp) return false;
      const today = new Date();
      const date = new Date(timestamp);
      return date.getDate() === today.getDate() &&
        date.getMonth() === today.getMonth() &&
        date.getFullYear() === today.getFullYear();
    }

    // REAL-TIME DATABASE LISTENERS
    function startAdminSync() {
      onValue(ref(db, 'products'), snap => {
        const data = snap.val() || {};
        window.products = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedAdmin && ['menu', 'products', 'stock', 'product_approval'].includes(window.activeView)) renderAdminDashboard();
      });

      onValue(ref(db, 'categories'), snap => {
        const data = snap.val() || {};
        window.categories = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedAdmin && ['products', 'stock', 'category'].includes(window.activeView)) renderAdminDashboard();
      });

      onValue(ref(db, 'orders'), snap => {
        const data = snap.val() || {};
        window.orders = Object.keys(data)
          .map(k => ({ id: k, ...data[k] }))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        if (window.storedAdmin && ['menu', 'orders', 'orders_approval', 'dues'].includes(window.activeView)) renderAdminDashboard();
      });

    window.loadTargetAppInfo = function(targetKey) {
      const info = window.appUpdateInfo || {};
      let targetData = {};

      if (targetKey === 'userApp') {
        targetData = info.userApp || {};
      } else if (targetKey === 'merchantApp') {
        targetData = info.merchantApp || {};
      } else {
        targetData = info.userApp || info.merchantApp || {};
      }

      document.getElementById('cfgAppVer').value = targetData.version || '1.8.0';
      document.getElementById('cfgAppUrl').value = targetData.downloadUrl || '';
      document.getElementById('cfgAppNotes').value = targetData.notes || '';
      document.getElementById('cfgForceUpdate').checked = !!targetData.forceUpdate;
    };

    window.saveSmartAppUpdateSettings = function() {
      const target = document.getElementById('cfgTargetApp').value;
      const version = document.getElementById('cfgAppVer').value.trim();
      const downloadUrl = document.getElementById('cfgAppUrl').value.trim();
      const notes = document.getElementById('cfgAppNotes').value.trim();
      const forceUpdate = document.getElementById('cfgForceUpdate').checked;

      if (!version || !downloadUrl) {
        showAdminToast('ভার্সন কোড এবং গিটহাব লিংক ঘর দুটি পূরণ করুন!');
        return;
      }

      const payload = {
        version,
        downloadUrl,
        notes,
        forceUpdate,
        updatedAt: Date.now()
      };

      if (target === 'all') {
        update(ref(db, 'app_update'), {
          userApp: payload,
          merchantApp: payload
        }).then(() => {
          showAdminToast('🎉 সকল অ্যাপের (User & Merchant) আপডেট সেভ হয়েছে!');
        });
      } else if (target === 'userApp') {
        update(ref(db, 'app_update/userApp'), payload).then(() => {

    window.approveCoupon = function(couponId) {
      if (!couponId) {
        showAdminToast('Error: Invalid Coupon ID!');
        return;
      }

      const existingCoupon = window.coupons.find(c => c.id === couponId);
      if (!existingCoupon) {
        showAdminToast('Error: কুপন খুঁজে পাওয়া যায়নি!');
        return;
      }

      const updatedCoupon = {
        ...existingCoupon,
        status: 'approved',
        active: true
      };
      delete updatedCoupon.id;

      set(ref(db, `coupons/${couponId}`), updatedCoupon)
        .then(() => {
          showAdminToast('🎉 কুপনটি সফলভাবে এপ্রুভ ও সক্রিয় করা হয়েছে!');
        })
        .catch(err => {
          console.error('Coupon Approval Error:', err);
          showAdminToast('Error: কুপন এপ্রুভ করা সম্ভব হয়নি!');
        });
    };

    window.rejectCoupon = function(couponId) {
      if (!couponId) {
        showAdminToast('Error: Invalid Coupon ID!');
        return;
      }

      remove(ref(db, `coupons/${couponId}`))
        .then(() => {
          showAdminToast('কুপনটি রিজেক্ট ও বাতিল করা হয়েছে');

        .catch(err => {
          console.error('Coupon Rejection Error:', err);
          showAdminToast('Error: রিজেক্ট করা সম্ভব হয়নি!');
        });
    };

      const amt = Number(document.getElementById('couponAmount').value);
      const expDate = document.getElementById('couponExpDate').value;

      if (!code || !amt || !expDate) {
        showAdminToast('সকল ঘর পূরণ করুন!');
        return;

      const newRef = push(ref(db, 'coupons'));

        discountAmount: amt, 
        expDate, 
        active: true, 
        status: 'approved',
        addedBy: 'Main Admin',
        createdAt: Date.now()

      const newRef = push(ref(db, 'notifications'));
      set(newRef, { title, message, createdAt: Date.now() }).then(() => {
        showAdminToast('📣 ব্রডকাস্ট নোটিফিকেশন পাঠানো হয়েছে!');
        renderAdminDashboard();
      });
    };

    window.deleteNotification = function(id) {
      remove(ref(db, `notifications/${id}`));
      showAdminToast('নোটিফিকেশন মোছা হয়েছে');
    };

    window.openAddProductModal = function() {
      window.renderProductFormModal(null);
    };

    window.openEditProductModal = function(productId) {
      const product = window.products.find(p => p.id === productId);
      if (product) {
        window.renderProductFormModal(product);
      }
    };

    window.renderProductFormModal = function(productToEdit = null) {
      const modal = document.getElementById('adminModal');
      const body = document.getElementById('modalBody');
      const isEdit = !!productToEdit;

      const categoryOptions = window.categories.length > 0 
        ? window.categories.map(c => `<option value="${escapeHTML(c.name)}" ${isEdit && productToEdit.category === c.name ? 'selected' : ''}>${escapeHTML(c.name)}</option>`).join('')
        : `<option value="General">General</option>`;

      let images = [];
      if (isEdit && productToEdit.imageUrl) {
        images = Array.isArray(productToEdit.imageUrl) ? productToEdit.imageUrl : [productToEdit.imageUrl];
      }
      if (images.length === 0) images = [''];

      body.innerHTML = `
        <h3 class="text-sm font-bold text-slate-100 mb-3">${isEdit ? 'এডিট প্রোডাক্ট' : t('addNewProduct')}</h3>
        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">${t('productNameLabel')}</label>
            <input type="text" id="pName" placeholder="Product Name" value="${isEdit ? escapeHTML(productToEdit.name) || '' : ''}" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white">
          </div>
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">${t('itemCodeText')}</label>
              <input type="text" id="pItemCode" placeholder="e.g. ITEM-102" value="${isEdit ? escapeHTML(productToEdit.itemCode) || '' : ''}" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white uppercase font-mono">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Category *</label>
              <select id="pCat" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-bold">
                ${categoryOptions}
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">${t('currentPriceLabel')}</label>
              <input type="number" id="pCurrPrice" placeholder="500" value="${isEdit ? productToEdit.currentPrice || '' : ''}" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">${t('stockLabel')}</label>
              <input type="number" id="pStock" value="${isEdit ? productToEdit.stock ?? 10 : 10}" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white">
            </div>
          </div>

          <div>
            <label class="text-slate-400 block mb-1">${t('productUrlLabel')}</label>
            <input type="text" class="pImgInput w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white" placeholder="https://..." value="${images[0] || ''}">
          </div>

          <div>
            <label class="block text-slate-400 mb-1">${t('productDescLabel')}</label>
            <textarea id="pDesc" placeholder="Product description..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white h-16">${isEdit ? escapeHTML(productToEdit.description) || '' : ''}</textarea>
          </div>

          <button onclick="saveProduct('${isEdit ? productToEdit.id : ''}')" class="w-full ${isEdit ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-indigo-600 hover:bg-indigo-500'} text-white font-bold py-2.5 rounded-xl text-xs mt-2 shadow transition">
            ${isEdit ? 'আপডেট প্রোডাক্ট' : t('saveProductBtn')}
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
    };

    window.saveProduct = function(productIdToEdit = '') {
      const isEdit = !!productIdToEdit;
      const name = document.getElementById('pName').value.trim();
      const itemCode = document.getElementById('pItemCode').value.trim().toUpperCase();
      const cat = document.getElementById('pCat').value;
      const curr = Number(document.getElementById('pCurrPrice').value) || 0;
      const stock = Number(document.getElementById('pStock').value) || 0;
      const desc = document.getElementById('pDesc').value.trim();
      const imgInp = document.querySelector('.pImgInput').value.trim();

      if (!name || !curr || !cat) {
        showAdminToast('নাম, দাম এবং ক্যাটাগরি দিন!');
        return;
      }

      const payload = {
        name,
        itemCode: itemCode || ('ITEM-' + Math.floor(1000 + Math.random() * 9000)),
        originalPrice: curr,
        currentPrice: curr,
        category: cat,
        stock,
        sold: isEdit ? (window.products.find(p => p.id === productIdToEdit)?.sold || 0) : 0,
        imageUrl: imgInp || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=200',
        description: desc
      };

      if (isEdit) {
        update(ref(db, `products/${productIdToEdit}`), payload)
          .then(() => {
            showAdminToast('🎉 প্রোডাক্ট সফলভাবে আপডেট করা হয়েছে!');
            closeAdminModal();
          });
      } else {
        payload.status = 'approved';
        payload.addedBy = 'Main Admin';
        payload.createdAt = Date.now();

        const newRef = push(ref(db, 'products'));
        set(newRef, payload).then(() => {
          showAdminToast('প্রোডাক্টটি সফলভাবে সেভ করা হয়েছে!');
          closeAdminModal();
        });
      }
    };

    window.deleteProduct = function(id) {
      if (!confirm('প্রোডাক্টটি মুছতে চান?')) return;
      remove(ref(db, `products/${id}`));
      showAdminToast('প্রোডাক্ট মোছা হয়েছে');
    };

    window.addDue = function() {
      const cust = document.getElementById('dueCustomer').value.trim();
      const amt = Number(document.getElementById('dueAmount').value);
      if (!cust || !amt) return;
      const newRef = push(ref(db, 'dues'));
      set(newRef, { customerName: cust, amount: amt, createdAt: Date.now() });
      showAdminToast('বকেয়া খাতায় যোগ হয়েছে');
    };

    window.deleteDue = function(id) {
      remove(ref(db, `dues/${id}`));
      showAdminToast('বকেয়া পরিশোধিত করা হয়েছে');
    };

    window.addCategory = function() {
      const name = document.getElementById('catNameInput').value.trim();
      if (!name) return;
      const newRef = push(ref(db, 'categories'));
      set(newRef, { name });
      showAdminToast('ক্যাটাগরি তৈরি হয়েছে');
    };

    window.deleteCategory = function(id) {
      remove(ref(db, `categories/${id}`));
      showAdminToast('ক্যাটাগরি মোছা হয়েছে');
    };

    window.closeAdminModal = function() {
      document.getElementById('adminModal').classList.add('hidden');
    };

    window.closeConfirmActionModal = function() {
      document.getElementById('confirmActionModal').classList.add('hidden');
    };

    window.handleAdminLogout = function() {
      signOut(auth).then(() => {
        window.storedAdmin = null;
        localStorage.removeItem('app_admin_session');
        window.activeView = 'menu';
        initAdminView();
        showAdminToast('এডমিন লগআউট হয়েছে।');
      });
    };

    initAdminView();
  </script>
</body>
</html>
