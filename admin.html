    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .unique-nav-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .unique-nav-card:active {
      transform: scale(0.95);
    }
    .unique-nav-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
    }

      window.currentLang = lang;
      localStorage.setItem('app_lang', lang);
      document.documentElement.lang = lang;
      if (window.renderAdminDashboard && window.storedAdmin) {
        window.renderAdminDashboard();
      } else if(window.renderAdminLoginScreen && !window.storedAdmin) {
        window.renderAdminLoginScreen();
      }
    }

    // Security Sanitizer (XSS Protection Filter)
    window.escapeHTML = function(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    };

  <!-- Firebase Realtime & Authentication Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged,
      sendPasswordResetEmail,
      RecaptchaVerifier,
      signInWithPhoneNumber
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyTaNvT8S6Xg304_9ntWozi1k3N4DmNxM",
      authDomain: "all-in1-shop.firebaseapp.com",
      databaseURL: "https://all-in1-shop-default-rtdb.firebaseio.com",
      projectId: "all-in1-shop",
      storageBucket: "all-in1-shop.firebasestorage.app",
      messagingSenderId: "120883945223",
      appId: "1:120883945223:web:9f74f7ff3aa78f637fafa2",
      measurementId: "G-BGKW9ZB4TV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.db = db;
    window.auth = auth;
    const ADMIN_UID = "8IFmnXc6yQSvVv2vpYz5WbTRh2G2";

    window.storedAdmin = JSON.parse(localStorage.getItem('app_admin_session')) || null;
    window.products = [];
    window.categories = [];
    window.orders = [];
    window.customers = [];
    window.coupons = [];
    window.dues = [];
    window.expenses = [];
    window.paymentMethods = [];
    window.notifications = [];
    window.activeView = 'menu';
    window.selectedProductCat = ' সকল ';
    window.selectedOrderStatusFilter = 'All';
    window.stockSearchQuery = '';
    window.orderSearchQuery = '';
    window.confirmationResult = null;
    
    window.currentAppVersion = localStorage.getItem('app_current_version') || 'v1.7.1';
    window.latestServerVersionInfo = null;

    // 🔹 গ্লোবাল অ্যাডমিন ও সাব-অ্যাডমিন/ডিলার রোল নিখুঁতভাবে চেক করার ফাংশন
    window.isRestrictedAdmin = function() {
      if (!window.storedAdmin) return false;
      
      // গ্লোবাল অ্যাডমিন হলে সে কোনো ফিল্টারের আওতায় থাকবে না (সম্পূর্ণ এক্সেস পাবে)
      if (window.storedAdmin.uid === ADMIN_UID || window.storedAdmin.role === 'Main Admin') {
        return false;
      }
      
      const roleStr = String(window.storedAdmin.role || '').toLowerCase();
      return roleStr.includes('sub') || roleStr.includes('dealer') || roleStr.includes('ডিলার');
    };

    window.showAdminToast = function(msg) {
      const toast = document.getElementById('adminToast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    };

    function isToday(timestamp) {
      if(!timestamp) return false;
      const today = new Date();
      const date = new Date(timestamp);
      return date.getDate() === today.getDate() &&
        date.getMonth() === today.getMonth() &&
        date.getFullYear() === today.getFullYear();
    }

    // REAL-TIME DATABASE LISTENERS
    function startAdminSync() {
      onValue(ref(db, 'app_update'), snap => {
        window.latestServerVersionInfo = snap.val() || null;
      });

      onValue(ref(db, 'products'), snap => {
        const data = snap.val() || {};
        window.products = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedAdmin && ['menu', 'products', 'stock', 'product_approval'].includes(window.activeView)) renderAdminDashboard();
      });

      onValue(ref(db, 'categories'), snap => {
        const data = snap.val() || {};
        window.categories = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedAdmin && ['products', 'stock', 'category'].includes(window.activeView)) renderAdminDashboard();
      });

      onValue(ref(db, 'orders'), snap => {
        const data = snap.val() || {};
        window.orders = Object.keys(data)
          .map(k => ({ id: k, ...data[k] }))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        if (window.storedAdmin && ['menu', 'orders', 'orders_approval', 'dues'].includes(window.activeView)) renderAdminDashboard();
      });

      onValue(ref(db, 'customers'), snap => {
        const data = snap.val() || {};
        window.customers = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedAdmin && window.activeView === 'customers') renderAdminDashboard();
      });

      onValue(ref(db, 'coupons'), snap => {
        const data = snap.val() || {};
        window.coupons = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedAdmin && window.activeView === 'coupons') renderAdminDashboard();
      });

      onValue(ref(db, 'dues'), snap => {
        const data = snap.val() || {};
        window.dues = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedAdmin && window.activeView === 'dues') renderAdminDashboard();
      });

      onValue(ref(db, 'expenses'), snap => {
        const data = snap.val() || {};
        window.expenses = Object.keys(data).map(k => ({ id: k, ...data[k] }));

    // ORDER STATUS UPDATE WITH NOTIFICATION
    window.updateOrderStatus = function(id, newStatus) {
      const order = window.orders.find(o => o.id === id);
      if (!order) return;

      const isDelivered = ['Delivered', 'ডেলিভার্ড', 'Delivery'].includes(newStatus);
      const wasDelivered = ['Delivered', 'ডেলিভার্ড', 'Delivery'].includes(order.status);

      if (isDelivered && !wasDelivered) {
        if (order.items && Array.isArray(order.items)) {
          order.items.forEach(item => {
            const prod = window.products.find(p => p.id === item.productId);
            if (prod) {
              const currentStock = Number(prod.stock) || 0;
              const currentSold = Number(prod.sold) || 0;
              const orderQty = Number(item.qty) || 1;

              const newStock = Math.max(0, currentStock - orderQty);
              const newSold = currentSold + orderQty;

              update(ref(db, `products/${prod.id}`), {
                stock: newStock,
                sold: newSold
              });
            }
          });
        }
      }

      update(ref(db, `orders/${id}`), { status: newStatus }).then(() => {
        showAdminToast(`Status updated to '${newStatus}'`);

        let notifTitle = `অর্ডার আপডেট (#${id.slice(-6)})`;
        let notifMsg = `আপনার #${id.slice(-6)} নম্বর অর্ডারের স্ট্যাটাস পরিবর্তন করে '${newStatus}' করা হয়েছে।`;

        if (newStatus === 'Pending') {
          notifTitle = "🎉 আপনার অর্ডারটি সফলভাবে কনফার্ম করা হয়েছে!";
          notifMsg = `প্রিয় ${order.userName}, আপনার #${id.slice(-6)} নম্বর অর্ডারটি সফলভাবে কনফার্ম ও গ্রহণ করা হয়েছে।`;
        } else if (newStatus === 'Processing') {
          notifTitle = "📦 আপনার প্রোডাক্ট-টি প্রসেসিংয়ে রয়েছে, অনুগ্রহ করে একটু অপেক্ষা করুন। ধন্যবাদ❣️";
          notifMsg = `প্রিয় ${order.userName}, আপনার #${id.slice(-6)} নম্বর অর্ডারের পণ্যগুলো প্যাকেজিং ও প্রসেসিংয়ের কাজ চলছে।`;
        } else if (newStatus === 'Delivered' || newStatus === 'Delivery') {
          notifTitle = "🚚 আপনার প্রোডাক্ট-টি ডেলিভারি সম্পন্ন হয়েছে, আমরা খুবই আনন্দিত। ধন্যবাদ আবার আসবেন❣️";
          notifMsg = `অভিনন্দন ${order.userName}! আপনার #${id.slice(-6)} নম্বর অর্ডারটি সফলভাবে ডেলিভারি করা হয়েছে। আমাদের সাথে থাকার জন্য ধন্যবাদ!`;

          notifTitle = "❌ আমরা সাময়িক ভাবে দুঃখিত, আপনার অর্ডার বাতিল/রিটার্ন করা হয়েছে";
          notifMsg = `প্রিয় ${order.userName}, দুঃখিত! আপনার #${id.slice(-6)} নম্বর অর্ডারটি বাতিল বা রিটার্ন প্রসেস করা হয়েছে। বিস্তারিত জানতে সাপোর্টে যোগাযোগ করুন।`;
        }

        const notifRef = push(ref(db, 'notifications'));
        set(notifRef, {
          title: notifTitle,
          message: notifMsg,
          userId: order.userId || order.userPhone,
          createdAt: Date.now()
        });
      });

    window.saveProduct = function(productIdToEdit = '') {
      const isEdit = !!productIdToEdit;
      const name = document.getElementById('pName').value.trim();
      const itemCode = document.getElementById('pItemCode').value.trim().toUpperCase();
      const cat = document.getElementById('pCat').value;
      const brand = document.getElementById('pBrand').value.trim();
      const size = document.getElementById('pSize').value || 'None';
      const color = document.getElementById('pColor').value.trim() || 'None';
      const orig = Number(document.getElementById('pOrigPrice').value) || 0;
      const curr = Number(document.getElementById('pCurrPrice').value) || 0;
      const stock = Number(document.getElementById('pStock').value) || 0;
      const desc = document.getElementById('pDesc').value.trim();

      const imgInputs = document.querySelectorAll('.pImgInput');
      const imgUrls = [];
      imgInputs.forEach(inp => {
        const val = inp.value.trim();
        if(val) imgUrls.push(val);
      });

      if (!name || !curr || !cat) {
        showAdminToast('নাম, দাম এবং ক্যাটাগরি দিন!');
        return;
      }

      const isSubAdminOrDealer = isRestrictedAdmin();

      const payload = {
        name,
        itemCode: itemCode || ('ITEM-' + Math.floor(1000 + Math.random() * 9000)),
        originalPrice: orig || curr,
        currentPrice: curr,
        category: cat,
        brand: brand,
        brandName: brand,
        size: size,
        color: color,
        stock,
        sold: isEdit ? (window.products.find(p => p.id === productIdToEdit)?.sold || 0) : 0,
        imageUrl: imgUrls.length > 0 ? (imgUrls.length === 1 ? imgUrls[0] : imgUrls) : '',
        description: desc
      };

      if (isEdit) {
        update(ref(db, `products/${productIdToEdit}`), payload)
          .then(() => {
            showAdminToast('🎉 প্রোডাক্ট সফলভাবে আপডেট করা হয়েছে!');
            closeAdminModal();
          });
      } else {
        payload.status = isSubAdminOrDealer ? 'pending' : 'approved';
        payload.addedBy = window.storedAdmin ? `${window.storedAdmin.name}` : 'Main Admin';
        payload.addedByUid = window.storedAdmin ? window.storedAdmin.uid : '';
        payload.createdAt = Date.now();

        const newRef = push(ref(db, 'products'));
        set(newRef, payload).then(() => {
          showAdminToast(isSubAdminOrDealer ? 'প্রোডাক্টটি অনুমোদনের জন্য পাঠানো হয়েছে!' : 'প্রোডাক্টটি সফলভাবে সেভ করা হয়েছে!');
          closeAdminModal();
        });
      }
    };

          <div class="space-y-1.5">
            <h4 class="font-bold text-slate-300 text-xs flex justify-between items-center">
              <span>অর্ডাকৃত পণ্যসমূহ:</span>
              <span class="text-[10px] text-slate-400 font-normal">মোট: ${(o.items || []).length} টি আইটেম</span>
            </h4>
            <div class="space-y-2 max-h-52 overflow-y-auto no-scrollbar">
              ${itemsListHtml}
            </div>
          </div>

          <div class="bg-slate-800 p-3 rounded-xl font-bold flex justify-between items-center border border-slate-700 text-sm shadow">
            <span>সর্বমোট পরিশোধযোগ্য:</span>
            <span class="text-emerald-400 font-black text-base">৳${o.totalAmount}</span>
          </div>

          <button onclick="closeAdminModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl text-xs transition">
            বন্ধ করুন
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
    };

    window.closeAdminModal = function() {
      document.getElementById('adminModal').classList.add('hidden');
    };

    window.handleAdminLogout = function() {
      signOut(auth).then(() => {
        window.storedAdmin = null;
        localStorage.removeItem('app_admin_session');
        window.activeView = 'menu';
        initAdminView();
        showAdminToast('এডমিন লগআউট হয়েছে।');
      }).catch(() => {
        window.storedAdmin = null;
        localStorage.removeItem('app_admin_session');
        window.activeView = 'menu';
        initAdminView();
        showAdminToast('এডমিন লগআউট হয়েছে।');
      });
    };

    initAdminView();
  </script>
</body>
</html>
