    function t(key) {
      return (translations[window.currentLang] && translations[window.currentLang][key]) || translations['en'][key] || key;
    }

    function setLanguage(lang) {
      window.currentLang = lang;
      localStorage.setItem('merchant_lang', lang);
      document.documentElement.lang = lang;
      if (window.renderDashboard && window.storedMerchant) {
        window.renderDashboard();
      } else if (window.renderAuthScreen && !window.storedMerchant) {
        window.renderAuthScreen();
      }
    }

    window.escapeHTML = function(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

  <!-- Firebase Script Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged,
      sendPasswordResetEmail,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyTaNvT8S6Xg304_9ntWozi1k3N4DmNxM",
      authDomain: "all-in1-shop.firebaseapp.com",
      databaseURL: "https://all-in1-shop-default-rtdb.firebaseio.com",
      projectId: "all-in1-shop",
      storageBucket: "all-in1-shop.firebasestorage.app",
      messagingSenderId: "120883945223",
      appId: "1:120883945223:web:9f74f7ff3aa78f637fafa2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.db = db;
    window.auth = auth;

    window.storedMerchant = JSON.parse(localStorage.getItem('app_merchant_session')) || null;
    window.products = [];
    window.categories = [];
    window.orders = [];
    window.customers = [];
    window.coupons = [];
    window.dues = [];
    window.expenses = [];
    window.merchantPayments = [];
    window.appUpdateInfo = null;
    window.activeView = 'menu';
    window.authMode = 'login';
    window.orderFilterTab = 'all'; 
    window.orderSearchQuery = '';

    // 📱 Native Back Button Logic
    window.lastBackPressTime = 0;

    function pushAppState(viewName) {
      history.pushState({ view: viewName }, '', '');
    }

    history.replaceState({ view: 'menu' }, '', '');

    window.addEventListener('popstate', (e) => {
      const modal = document.getElementById('merchantModal');
      const confirmModal = document.getElementById('confirmActionModal');

      if (modal && !modal.classList.contains('hidden')) {
        closeMerchantModal();
        pushAppState(window.activeView);
        return;
      }

      if (confirmModal && !confirmModal.classList.contains('hidden')) {
        closeConfirmActionModal();
        pushAppState(window.activeView);
        return;
      }

      if (window.activeView !== 'menu') {
        window.activeView = 'menu';
        updateNavHighlight('dashboard');
        renderDashboard();
        pushAppState('menu');
      } else {
        const currentTime = new Date().getTime();
        if (currentTime - window.lastBackPressTime < 3000) {
          window.close();
        } else {
          window.lastBackPressTime = currentTime;
          showToast(t('exitPrompt'));
          pushAppState('menu');
        }
      }
    });

    window.showToast = function(msg) {
      const toast = document.getElementById('merchantToast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    };

    // Realtime Firebase Data Sync
    function startMerchantSync() {
      onValue(ref(db, 'products'), snap => {
        const data = snap.val() || {};
        window.products = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedMerchant) renderDashboard();
      });

      onValue(ref(db, 'categories'), snap => {
        const data = snap.val() || {};
        window.categories = Object.keys(data).map(k => ({ id: k, ...data[k] }));
      });

      onValue(ref(db, 'orders'), snap => {
        const data = snap.val() || {};
        window.orders = Object.keys(data).map(k => ({ id: k, ...data[k] })).sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
        if (window.storedMerchant) renderDashboard();
      });

      onValue(ref(db, 'customers'), snap => {
        const data = snap.val() || {};
        window.customers = Object.keys(data).map(k => ({ id: k, ...data[k] }));
      });

      onValue(ref(db, 'coupons'), snap => {
        const data = snap.val() || {};
        window.coupons = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedMerchant && window.activeView === 'coupons') renderDashboard();
      });

      onValue(ref(db, 'dues'), snap => {
        const data = snap.val() || {};
        window.dues = Object.keys(data).map(k => ({ id: k, ...data[k] }));
      });

      onValue(ref(db, 'expenses'), snap => {
        const data = snap.val() || {};
        window.expenses = Object.keys(data).map(k => ({ id: k, ...data[k] }));
      });

      onValue(ref(db, 'merchant_payments'), snap => {
        const data = snap.val() || {};
        window.merchantPayments = Object.keys(data).map(k => ({ id: k, ...data[k] }));
        if (window.storedMerchant && window.activeView === 'merchant_payment_setup') renderDashboard();
      });

      onValue(ref(db, 'app_update'), snap => {
        const updates = snap.val() || {};
        window.appUpdateInfo = updates.merchantApp || updates.userApp || null;
      });
    }

    startMerchantSync();

    // 🔒 Enhanced Auth Listener - Direct Path Lookup (Prevents Permission Errors)
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const uid = user.uid;
          const userEmail = (user.email || '').toLowerCase().trim();

          let accountData = null;
          let role = 'Dealer';

          // 1. Direct Check: Merchants/Dealers/{uid}
          try {
            const dealerSnap = await get(ref(db, `Merchants/Dealers/${uid}`));
            if (dealerSnap.exists()) {
              accountData = dealerSnap.val();
              role = accountData.role || 'Dealer';
            }
          } catch(e) {}

          // 2. Direct Check: Merchants/SubAdmins/{uid}
          if (!accountData) {
            try {
              const subAdminSnap = await get(ref(db, `Merchants/SubAdmins/${uid}`));
              if (subAdminSnap.exists()) {
                accountData = subAdminSnap.val();
                role = accountData.role || 'SubAdmin';
              }
            } catch(e) {}
          }

          // 3. Fallback: Search in Dealers or SubAdmins list by email
          if (!accountData) {
            try {
              const dealersSnap = await get(ref(db, 'Merchants/Dealers'));
              if (dealersSnap.exists()) {
                const dealers = dealersSnap.val() || {};
                const dKey = Object.keys(dealers).find(k => (dealers[k].contact || '').toLowerCase().trim() === userEmail);
                if (dKey) {
                  accountData = dealers[dKey];
                  role = accountData.role || 'Dealer';
                }
              }
            } catch(e) {}
          }

          if (!accountData) {
            try {
              const subAdminsSnap = await get(ref(db, 'Merchants/SubAdmins'));
              if (subAdminsSnap.exists()) {
                const subAdmins = subAdminsSnap.val() || {};
                const sKey = Object.keys(subAdmins).find(k => (subAdmins[k].contact || '').toLowerCase().trim() === userEmail);
                if (sKey) {
                  accountData = subAdmins[sKey];
                  role = accountData.role || 'SubAdmin';
                }
              }
            } catch(e) {}
          }

          // 🛑 Permit Login Only If Account Exists under Dealers or SubAdmins
          if (accountData) {
            const finalRole = accountData.role || role;
            const name = accountData.name || user.displayName || 'Merchant';

            const session = { name, contact: user.email, role: finalRole, uid: user.uid };
            window.storedMerchant = session;
            localStorage.setItem('app_merchant_session', JSON.stringify(session));
            initMerchantView();
          } else {
            // ❌ Access Denied! Unapproved user signed out automatically
            await signOut(auth);
            window.storedMerchant = null;
            localStorage.removeItem('app_merchant_session');
            showToast('❌ অ্যাকাউন্টটি এখনো অনুমোদিত নয়! এডমিন ডাটাবেজে ম্যানুয়ালি যুক্ত করার পর চেষ্টা করুন।');
            initMerchantView();
          }
        } catch (err) {
          console.error("Auth check exception:", err);
          await signOut(auth);
          window.storedMerchant = null;
          localStorage.removeItem('app_merchant_session');
          showToast('❌ ডাটাবেজ এক্সেস করার পারমিশন নেই বা নেটওয়ার্ক সমস্যা!');
          initMerchantView();
        }
      } else {
        window.storedMerchant = null;
        localStorage.removeItem('app_merchant_session');
        initMerchantView();
      }
    });

    function initMerchantView() {
      if (!window.storedMerchant) {
        document.getElementById('merchantHeader').classList.add('hidden');
        document.getElementById('merchantNav').classList.add('hidden');
        renderAuthScreen();
      } else {
        document.getElementById('merchantHeader').classList.remove('hidden');
        document.getElementById('merchantNav').classList.remove('hidden');
        document.getElementById('headerRoleTitle').innerText = `${window.storedMerchant.role} Panel`;
        renderDashboard();
      }
    }

    // Auth Screen
    window.renderAuthScreen = function() {
      const main = document.getElementById('merchantMain');
      main.innerHTML = `
        <div class="min-h-[80vh] flex flex-col justify-center items-center py-6">
          <div class="text-center mb-6">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-3xl mx-auto flex items-center justify-center text-white text-3xl shadow-xl shadow-indigo-600/30 mb-3">
              <i class="fa-solid fa-store"></i>

    window.handleLogin = function() {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value;

      if (!email || !pass) {
        showToast('Please enter Email and Password!');
        return;
      }

      signInWithEmailAndPassword(auth, email, pass)
        .then(() => showToast('Authenticating...'))
        .catch(() => showToast('Invalid email or password!'));
    };

    // 🔒 Registration Logic - Saves to 'PendingMerchants' for Admin Manual Approval
    window.handleRegister = function() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const role = document.getElementById('regRole').value;
      const pass = document.getElementById('regPass').value;

      if (!name || !email || !pass) {
        showToast('Please fill in all fields correctly!');
        return;
      }

      createUserWithEmailAndPassword(auth, email, pass)
        .then((userCredential) => {
          const user = userCredential.user;

          updateProfile(user, { displayName: name });

          const userRef = ref(db, 'PendingMerchants/' + user.uid);
          const userData = { 
            uid: user.uid,
            contact: email, 
            name: name, 
            password: pass, 
            role: role,
            createdAt: Date.now()
          };

          set(userRef, userData).then(() => {
            signOut(auth);
            window.storedMerchant = null;
            localStorage.removeItem('app_merchant_session');
            
            alert(`🎉 রেজিস্ট্রেশন সফল হয়েছে!\n\nএডমিন ডাটাবেজে আপনার অ্যাকাউন্টটি ${role} নোডে ম্যানুয়ালি যুক্ত করলে তবেই আপনি প্যানেলে লগইন করতে পারবেন।`);
            window.authMode = 'login';
            initMerchantView();
          });
        })
        .catch((err) => showToast('Error: ' + err.message));
    };

            <input type="number" id="addStockQty" placeholder="e.g. 20" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white font-mono text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <button onclick="saveRefilledStock('${prodId}', ${currentStock})" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs shadow-lg transition">
            Update Stock
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
      pushAppState('modal');
    };

    window.saveRefilledStock = function(prodId, currentStock) {
      const addQty = Number(document.getElementById('addStockQty').value) || 0;
      if (addQty <= 0) {
        showToast('Please enter a valid stock quantity!');
        return;
      }

      const productRef = ref(db, `products/${prodId}`);
      update(productRef, { stock: currentStock + addQty })
        .then(() => {
          showToast(`🎉 Stock updated (+${addQty} Pcs added)!`);
          closeMerchantModal();
          renderDashboard();
        })
        .catch(err => showToast('Error: ' + err.message));
    };

    window.updateOrderStatus = function(orderId, newStatus) {
      if (!orderId || !newStatus) return;
      
      const order = window.orders.find(o => o.id === orderId);
      const isDelivered = newStatus === '3. Delivery' || newStatus.toLowerCase().includes('deliver');
      
      const orderRef = ref(db, `orders/${orderId}`);

      update(orderRef, { 
        status: newStatus,
        stockDeducted: isDelivered ? true : (order ? !!order.stockDeducted : false)
      }).then(() => {

        if (isDelivered && order && !order.stockDeducted && Array.isArray(order.items)) {
          order.items.forEach(item => {
            if (item.productId) {
              const productRef = ref(db, `products/${item.productId}`);
              get(productRef).then(snap => {
                if (snap.exists()) {
                  const pData = snap.val();
                  const qty = Number(item.qty || item.quantity || 1);
                  const currentStock = Number(pData.stock || 0);
                  const currentSold = Number(pData.sold || 0);

                  const newStock = Math.max(0, currentStock - qty);
                  const newSold = currentSold + qty;

                  update(productRef, {
                    stock: newStock,
                    sold: newSold
                  });
                }
              });
            }
          });
        }

        showToast(`🎉 Order #${orderId.slice(-6)} Status Updated to: ${newStatus}`);
        renderDashboard();
      }).catch(err => showToast('Error updating status: ' + err.message));
    };

    window.viewOrderItemsModal = function(orderId) {
      const order = window.orders.find(o => o.id === orderId);
      if (!order) return;

      const modal = document.getElementById('merchantModal');
      const body = document.getElementById('modalBody');

      const defaultPlaceholder = 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=150';

      const itemsHtml = (order.items || []).map(i => {
        const prod = window.products.find(p => p.id === i.productId) || {};
        
        let rawImg = i.image || i.img || i.imageUrl || prod.imageUrl || prod.image;
        let imgSrc = defaultPlaceholder;

        if (Array.isArray(rawImg) && rawImg.length > 0) {
          imgSrc = rawImg[0];
        } else if (typeof rawImg === 'string' && rawImg.trim().length > 5) {
          imgSrc = rawImg.trim();
        }

        const qty = i.qty || i.quantity || 1;
        const price = i.price || i.currentPrice || 0;
        const totalItemPrice = qty * price;

        return `
          <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex items-center gap-3">
            <div class="w-12 h-12 rounded-lg bg-slate-900 border border-slate-700 overflow-hidden flex-shrink-0 flex items-center justify-center">
              <img src="${imgSrc}" onerror="this.onerror=null;this.src='${defaultPlaceholder}';" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 text-xs">
              <h4 class="font-bold text-slate-100 leading-tight">${escapeHTML(i.name || prod.name || 'Product Item')}</h4>
              <p class="text-[10px] text-slate-400 mt-1">Qty: ${qty} x ৳${price}</p>
            </div>
            <span class="font-extrabold text-emerald-400 text-xs">৳${totalItemPrice}</span>
          </div>
        `;
      }).join('');

      body.innerHTML = `
        <h3 class="text-sm font-bold text-slate-100 mb-2 border-b border-slate-700 pb-2">
          📦 Order Details (#${order.id.slice(-6)})
        </h3>
        <div class="space-y-3 text-xs">
          <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-[11px] space-y-1">
            <p><strong>Customer:</strong> ${escapeHTML(order.userName)}</p>
            <p><strong>Email/Contact:</strong> ${escapeHTML(order.userEmail || order.userPhone || 'N/A')}</p>
            <p><strong>Address:</strong> ${escapeHTML(order.shippingAddress || order.address || 'Dewanganj')}</p>
            <p><strong>Total Amount:</strong> <span class="text-emerald-400 font-bold">৳${order.totalAmount}</span></p>
          </div>

          <h4 class="font-bold text-slate-300 text-xs">Ordered Items:</h4>
          <div class="space-y-2 max-h-60 overflow-y-auto no-scrollbar">
            ${itemsHtml}
          </div>
        </div>
      `;

      modal.classList.remove('hidden');
      pushAppState('modal');
    };

    // Modal Actions

        : `<option value="Electronics">Electronics</option>
           <option value="Fashion">Fashion</option>
           <option value="Groceries">Groceries</option>
           <option value="General">General</option>`;

      body.innerHTML = `
        <h3 class="text-sm font-bold text-slate-100 mb-3 border-b border-slate-700 pb-2">Add New Product</h3>
        <div class="space-y-3 text-xs">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">Product Name *</label>
            <input type="text" id="pName" placeholder="Product Name" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1">Item Code:</label>
              <input type="text" id="pItemCode" placeholder="E.G. ITEM-102" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white uppercase font-mono focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1">Category *</label>
              <select id="pCategory" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white font-bold focus:outline-none focus:border-indigo-500">
                ${categoryOptions}
              </select>
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">© Brand Name (Optional)</label>
            <input type="text" id="pBrand" placeholder="e.g. Nike, Samsung, Walton, Apex" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1">Size</label>
              <select id="pSize" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
                <option value="None">None</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1">Colour Variant</label>
              <input type="text" id="pColor" placeholder="None" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1">Current Price *</label>
              <input type="number" id="pCurrPrice" placeholder="500" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1">Old Price</label>
              <input type="number" id="pOldPrice" placeholder="700" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-[10px] font-bold text-slate-400 mb-1">Stock *</label>
              <input type="number" id="pStock" placeholder="10" value="10" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-indigo-500">
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-[10px] font-bold text-slate-400">Product Image URL Link(s)</label>
              <button type="button" onclick="addMoreImgInput()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-lg shadow transition">
                + Add More
              </button>
            </div>
            <div id="imgUrlContainer" class="space-y-2">
              <input type="text" class="pImgUrlInputs w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white text-xs focus:outline-none focus:border-indigo-500" placeholder="https://...">
            </div>
          </div>

          <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">Product Description</label>
            <textarea id="pDesc" placeholder="Product description..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white h-20 focus:outline-none focus:border-indigo-500"></textarea>
          </div>

          <button onclick="saveMerchantProduct()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs shadow-lg transition mt-2">
            Save Product
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
      pushAppState('modal');
    };

    window.addMoreImgInput = function() {
      const container = document.getElementById('imgUrlContainer');
      const div = document.createElement('div');
      div.className = "flex gap-2 items-center";
      div.innerHTML = `
        <input type="text" class="pImgUrlInputs w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-white text-xs focus:outline-none focus:border-indigo-500" placeholder="https://...">
        <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 bg-slate-800 border border-slate-700 p-2 rounded-xl">
          <i class="fa-solid fa-trash text-xs"></i>
        </button>
      `;
      container.appendChild(div);
    };

    window.saveMerchantProduct = function() {
      const name = document.getElementById('pName').value.trim();
      const itemCode = document.getElementById('pItemCode').value.trim().toUpperCase();
      const category = document.getElementById('pCategory').value;
      const brand = document.getElementById('pBrand').value.trim();
      const size = document.getElementById('pSize').value;
      const color = document.getElementById('pColor').value.trim();
      
      const curr = Number(document.getElementById('pCurrPrice').value) || 0;
      const oldPrice = Number(document.getElementById('pOldPrice').value) || 0;
      const stock = Number(document.getElementById('pStock').value) || 0;
      const desc = document.getElementById('pDesc').value.trim();

      const imgElements = document.querySelectorAll('.pImgUrlInputs');
      const imageUrls = Array.from(imgElements)
        .map(input => input.value.trim())
        .filter(url => url.length > 0);

      if (!name || !curr) {
        showToast('Please enter Product Name and Current Price!');
        return;
      }

      const payload = {
        name,
        itemCode: itemCode || ('ITEM-' + Math.floor(1000 + Math.random()*9000)),
        category: category || 'General',
        brand: brand || 'Generic',
        size: size || 'None',
        color: color || 'None',
        originalPrice: oldPrice || curr,
        currentPrice: curr,
        stock,
        sold: 0,
        imageUrl: imageUrls.length > 0 ? imageUrls : ['https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=200'],
        description: desc,
        status: 'pending',
        addedBy: window.storedMerchant.name,
        addedByUid: window.storedMerchant.uid,
        createdAt: Date.now()
      };

      const newRef = push(ref(db, 'products'));
      set(newRef, payload).then(() => {
        showToast('🎉 Product submitted for Global Admin approval!');
        closeMerchantModal();
      });
    };

    window.openAddMerchantPaymentModal = function() {
      const modal = document.getElementById('merchantModal');
      const body = document.getElementById('modalBody');

      body.innerHTML = `
        <h3 class="text-sm font-bold text-slate-100 mb-3">+ Add Personal Payment Account</h3>
        <div class="space-y-2.5 text-xs">
          <div>
            <label class="block text-slate-400 mb-1">Method Name *</label>
            <input type="text" id="mPmName" placeholder="e.g. bKash, Nagad, Bank" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-bold">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Account Number / Details *</label>
            <input type="text" id="mPmNumber" placeholder="017xxxxxxxx or Bank AC Details" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Account Type</label>
            <select id="mPmType" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-white font-bold">
              <option value="Personal">Personal</option>
              <option value="Merchant">Merchant</option>
              <option value="Agent">Agent</option>
              <option value="Bank">Bank Account</option>
            </select>
          </div>
          <button onclick="saveMerchantPayment()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs mt-2 shadow transition">
            ${t('savePaymentBtn')}
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
      pushAppState('modal');
    };

    window.saveMerchantPayment = function() {
      const methodName = document.getElementById('mPmName').value.trim();
      const number = document.getElementById('mPmNumber').value.trim();
      const type = document.getElementById('mPmType').value;

      if (!methodName || !number) {
        showToast('Please fill in all details!');
        return;
      }

      const newRef = push(ref(db, 'merchant_payments'));
      set(newRef, {
        methodName,
        number,
        type,
        merchantName: window.storedMerchant.name,
        merchantEmail: window.storedMerchant.contact,
        merchantUid: window.storedMerchant.uid,
        createdAt: Date.now()
      }).then(() => {
        showToast('🎉 Payment Account saved securely (Visible to Global Admin only)!');
        closeMerchantModal();
      });
    };

    window.deleteMerchantPayment = function(id) {
      if (!confirm('Delete this payment account?')) return;
      remove(ref(db, `merchant_payments/${id}`));
      showToast('Payment account removed');
    };

    window.addDue = function() {
      const cust = document.getElementById('dueCustomer').value.trim();
      const amt = Number(document.getElementById('dueAmount').value);
      if(!cust || !amt) return;

      const newRef = push(ref(db, 'dues'));
      set(newRef, { customerName: cust, amount: amt, addedByUid: window.storedMerchant.uid, createdAt: Date.now() });
      showToast('Due record added');
      renderDashboard();
    };

    window.deleteDue = function(id) {
      remove(ref(db, `dues/${id}`));
      showToast('Due record cleared');
      renderDashboard();
    };

    window.addExpense = function() {
      const date = document.getElementById('expDate').value;
      const title = document.getElementById('expTitle').value.trim();
      const amt = Number(document.getElementById('expAmount').value);
      if(!date || !title || !amt) return;

      const newRef = push(ref(db, 'expenses'));
      set(newRef, { date, title, amount: amt, addedByUid: window.storedMerchant.uid, createdAt: Date.now() });
      showToast('Expense saved');
      renderDashboard();
    };

    window.addCoupon = function() {
      const code = document.getElementById('cpCode').value.trim().toUpperCase();
      const amt = Number(document.getElementById('cpAmount').value);
      const expDate = document.getElementById('cpExpDate').value;

      if (!code || !amt || !expDate) {
        showToast('Please enter all coupon details!');
        return;
      }

      const newRef = push(ref(db, 'coupons'));
      set(newRef, { 
        code, 
        discountType: 'flat', 
        discountAmount: amt, 
        expDate, 
        active: false,
        status: 'pending',
        addedBy: window.storedMerchant.name,
        addedByUid: window.storedMerchant.uid, 
        createdAt: Date.now() 
      }).then(() => {
        showToast('🎉 Coupon request sent to Global Admin!');
        renderDashboard();
      });
    };

    window.deleteCoupon = function(id) {
      remove(ref(db, `coupons/${id}`));
      showToast('Coupon deleted');
      renderDashboard();
    };

    window.closeMerchantModal = function() {
      document.getElementById('merchantModal').classList.add('hidden');
    };

    window.closeConfirmActionModal = function() {
      document.getElementById('confirmActionModal').classList.add('hidden');
    };

    window.handleLogout = function() {
      signOut(auth).then(() => {
        window.storedMerchant = null;
        localStorage.removeItem('app_merchant_session');
        initMerchantView();
        showToast('Logged out successfully.');
      });
    };

    initMerchantView();
  </script>
</body>
</html>
